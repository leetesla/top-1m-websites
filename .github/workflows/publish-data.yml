name: Publish October 2026 top-sites subset

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build.py'
      - '.github/workflows/publish-data.yml'

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate dataset
        run: python3 scripts/build.py
      - name: Commit generated CSV and gzip files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/202610.csv data/202610.csv.gz data/top-1000.csv data/tld-counts.csv
          if git diff --cached --quiet; then
            echo 'Dataset unchanged'
          else
            git commit -m 'data: publish filtered October 2026 top websites [skip ci]'
            git pull --rebase origin main
            git push
          fi
